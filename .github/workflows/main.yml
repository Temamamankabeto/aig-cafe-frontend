name: Build Frontend Artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: https://enterposback.adamacity.gov.et
      NEXT_PUBLIC_API_URL: https://enterposback.adamacity.gov.et/api
      NEXT_PUBLIC_API_TIMEOUT: 15000

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

        - name: Install dependencies
           run: npm ci --include=dev

      - name: Build Next.js
        run: npm run build

      - name: Prepare standalone deployment artifact
        shell: bash
        run: |
          rm -rf deploy
          mkdir -p deploy/.next

          cp -a .next/standalone/. deploy/
          cp -a .next/static deploy/.next/static

          if [ -d "public" ]; then
            cp -a public deploy/public
          fi

      - name: Verify deployment artifact
        shell: bash
        run: |
          test -f deploy/server.js
          test -d deploy/.next/static

          echo "Deployment artifact created successfully."
          find deploy -maxdepth 2 -type f | head -50

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: enterpos-frontend-standalone
          path: deploy/
          if-no-files-found: error
          retention-days: 7